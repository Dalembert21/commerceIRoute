<div class="pantalla-login">
  <div class="tarjeta-login">
    <div class="cabecera-login">
      <div class="marca-login">
        <img src="logoModificado.png" alt="Logo iRoute" class="logo-login" />
        <h1 class="titulo-login">iRoute</h1>
      </div>
      <p class="subtitulo-login">Solutions</p>
    </div>

    @if (errorMensaje) {
    <div class="alerta alerta-peligro">
      <span>{{ errorMensaje }}</span>
    </div>
    }

    <form (ngSubmit)="iniciarSesion()">
      <div class="campo-formulario">
        <label class="etiqueta-campo" for="usuario">Usuario</label>
        <input id="usuario" type="text" class="entrada-texto" placeholder="Ingrese su usuario" [(ngModel)]="usuario" name="usuario" required />
      </div>

      <div class="campo-formulario">
        <label class="etiqueta-campo" for="clave">Contraseña</label>
        <div class="contenedor-clave">
          <input
            id="clave"
            [type]="mostrarClave ? 'text' : 'password'"
            class="entrada-texto entrada-clave"
            placeholder="Ingrese su contraseña"
            [(ngModel)]="clave"
            name="clave"
            required
          />
          <button
            type="button"
            class="boton-ver-clave"
            (click)="alternarMostrarClave()"
            [attr.aria-label]="mostrarClave ? 'Ocultar contraseña' : 'Ver contraseña'"
            [title]="mostrarClave ? 'Ocultar contraseña' : 'Ver contraseña'"
          >
            @if (mostrarClave) {
              <!-- Icono Ojo Tachado (Ocultar) -->
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            } @else {
              <!-- Icono Ojo Abierto (Ver) -->
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            }
          </button>
        </div>
      </div>

      <button type="submit" class="boton boton-primario ancho-completo">
        Ingresar
      </button>
    </form>

    <div class="credenciales-demo">
      <span class="titulo-demo">Credenciales:</span>
      <button type="button" class="boton-demo-chip" (click)="rellenarCredenciales('admin', '123456')">
        admin / 123456
      </button>
    </div>
  </div>
</div>
